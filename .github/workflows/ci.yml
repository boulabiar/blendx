name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # A cold Hermes build is sizeable on GitHub's shared runners.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build python3-pygments python3-yaml

      - run: npm ci
      - run: npm run check:generated

      - name: Configure pinned native dependencies
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DBLENDX_BUILD_NODE_ADDON=ON

      - name: Build Hermes host, compiler, and test addon
        run: cmake --build build --target blendx_hermes hermesc blendx_native -j 4

      - run: npm run build:types
      - run: node --test tests/*.test.mjs

      - name: Run the 5,000-message Hermes workload
        run: node tools/hermes-app.mjs run examples/chat.tsx -- --headless

      - name: Run the GPUix native-text showcase port
        run: node tools/hermes-app.mjs run examples/showcase.tsx -- --headless

      - name: Run the GPUix diff review port
        run: node tools/hermes-app.mjs run examples/diff.tsx -- --headless

      - name: Run the animated operations dashboard
        run: node tools/hermes-app.mjs run examples/dashboard.tsx -- --headless

      - name: Run the live log explorer
        run: node tools/hermes-app.mjs run examples/logs.tsx -- --headless

      - name: Run floating controls under Hermes
        run: node tools/hermes-app.mjs run examples/components.tsx -- --headless

      - name: Run selection and navigation controls under Hermes
        run: |
          node tools/hermes-app.mjs run examples/controls.tsx -- --headless
          node tools/hermes-app.mjs run examples/disclosure.tsx -- --headless
          node tools/hermes-app.mjs run examples/menus.tsx -- --headless

      - name: Run application foundation gallery under Hermes
        run: node tools/hermes-app.mjs run examples/foundation.tsx -- --headless

      - name: Run visual component stress smoke test
        run: node tools/hermes-app.mjs run examples/visual-stress.tsx -- --headless --components=100 --duration=1200

      - name: Verify the packed executable
        run: node tools/hermes-app.mjs pack examples/chat.tsx build/blendx-chat && ./build/blendx-chat --headless

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build python3-pygments python3-yaml

      - run: npm ci

      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBLENDX_BUILD_NODE_ADDON=ON -DBLENDX_ENABLE_SANITIZERS=ON

      - name: Build instrumented BlendX targets
        run: cmake --build build-sanitize --target blendx_native blendx_model_tests -j 4

      - run: npm run build:types

      - name: Run native model tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

      - name: Run the real renderer integration suite under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" node --test tests/native.test.mjs tests/react.test.mjs tests/golden.test.mjs
